[package]
name = "open-photometric-toolbox"
version = "1.0.0"
description = "Open Photometric Toolbox - Modern Photometric Engineering & Visualization"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
font-kit = "0.14"
encoding_rs = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

name: Release desktop binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 standalone executable
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust stable
        run: rustup update stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build standalone executable
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Upload executable to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath src-tauri/target/x86_64-pc-windows-msvc/release/open-photometric-toolbox.exe -Destination open-photometric-toolbox-windows-x64.exe
          gh release upload "$env:GITHUB_REF_NAME" open-photometric-toolbox-windows-x64.exe --clobber

  linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust stable
        run: rustup update stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfontconfig1-dev libfuse2t64 patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri -- build --bundles appimage --target x86_64-unknown-linux-gnu -- --locked

      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage --clobber
